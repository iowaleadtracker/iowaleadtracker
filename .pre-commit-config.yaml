# Checks run on every commit. Set up once with:
#   pip install -r requirements-dev.txt && pre-commit install
# Run by hand with:  pre-commit run --all-files
# Tool versions match requirements-dev.txt; bump both together.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=4000"]  # the saved forecasts are about 2.6 MB
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: end-of-file-fixer
        exclude: ^scenarios/.*/met_cache/  # saved API responses: kept byte-for-byte
      - id: trailing-whitespace
        exclude: ^scenarios/.*/met_cache/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # check the files listed in pyproject.toml, with the libraries they import
        pass_filenames: false
        additional_dependencies: ["numpy==2.5.5", "pytest==9.2.0"]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast tests; run `pytest` for the full suite)
        entry: python -m pytest -m "not slow" -q
        language: python
        additional_dependencies: ["numpy==2.5.5", "pytest==9.2.0"]
        pass_filenames: false
        types_or: [python, html, json, toml]
