# Downloads GFS and ECMWF forecasts for the unlisted Tuesday/Wednesday maps
# (scenarios/iowa-aap-lead-azide/unlisted.py) and proposes them as a pull request. Run by
# hand only: Actions → "Refresh unlisted forecast" → Run workflow. It never deploys;
# merging the pull request does (.github/workflows/deploy.yml), so check the news first.
#
# It touches only met_cache/unlisted_forecasts.json, so the public maps and the hourly
# refresh's pull requests are unaffected.
name: Refresh unlisted forecast

on:
  workflow_dispatch:

permissions:
  contents: write # push the forecast-refresh-unlisted branch
  pull-requests: write # open or update its pull request
  actions: write # start CI on that branch (pushes made by this workflow don't)

concurrency:
  group: refresh-unlisted
  cancel-in-progress: false

env:
  BRANCH: forecast-refresh-unlisted
  LAST_DAY: "2026-11-25" # the last day the unlisted maps model (Central time)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Still before the last day?
        id: when
        run: |
          today=$(TZ=America/Chicago date +%F)
          if [[ "$today" > "$LAST_DAY" ]]; then
            echo "It's $today, after $LAST_DAY; nothing to refresh." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.when.outputs.go == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v7
        if: steps.when.outputs.go == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        if: steps.when.outputs.go == 'true'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Download forecasts and rebuild the unlisted maps
        id: refresh
        if: steps.when.outputs.go == 'true'
        run: |
          set +e
          python tools/refresh_forecast.py --unlisted
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "The forecasts haven't changed since the saved pull." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.refresh.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Push the branch and open or update the pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pulled=$(python - <<'PY'
          import datetime as dt, json
          from pathlib import Path
          f = Path("scenarios/iowa-aap-lead-azide/met_cache/unlisted_forecasts.json")
          stamps = json.loads(f.read_text())["__fetched__"]
          t = min(dt.datetime.fromisoformat(v) for v in stamps.values())
          print(f"{t.astimezone(dt.timezone(dt.timedelta(hours=-6))):%b %-d, %-I:%M %p} CST")
          PY
          )
          title="Refresh unlisted Tue/Wed forecast (GFS, ECMWF; pulled $pulled)"
          {
            echo "GFS and ECMWF forecasts for the unlisted Tuesday/Wednesday maps, pulled $pulled by the hand-started refresh."
            echo
            echo "Changes: \`met_cache/unlisted_forecasts.json\` only. The public maps don't change. The full test suite passed."
            echo
            echo "**Before merging**, check the news. Merging deploys iowaleadtracker.com (the Deploy workflow); the unlisted maps stay off the mirror."
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add scenarios/*/met_cache/unlisted_forecasts.json
          git commit -q -F - <<MSG
          $title

          Downloaded by .github/workflows/refresh-unlisted.yml for the unlisted
          Tuesday/Wednesday maps (unlisted.py). The public maps don't change.
          MSG
          git push --force origin "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated $(gh pr view "$BRANCH" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base main --head "$BRANCH" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md"; then
            echo "Opened $(gh pr view "$BRANCH" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Couldn't open the pull request (allow GitHub Actions to create pull requests in the repository settings). Open it by hand: $url"
            echo "Pushed \`$BRANCH\`. Open the pull request by hand: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
