# Downloads fresh weather forecasts for the Iowa scenario every 3 hours through
# Wednesday, Nov. 25 (the court filing leaves the blast day open), and proposes them as a pull request (main takes changes only through a
# reviewed pull request). It never deploys; merging the pull request does
# (.github/workflows/deploy.yml), so check the news before merging.
name: Refresh forecast

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours: one run downloads 4 models (8 until Nov. 23) for a 25-point grid and
    # each modeled day (DAYS), and hourly runs hit Open-Meteo's free daily limit on Nov. 22.
    - cron: "40 */3 * * *"

permissions:
  contents: write # push the forecast-refresh branch
  pull-requests: write # open or update its pull request
  actions: write # start CI on that branch (pushes made by this workflow don't)

concurrency:
  group: refresh-forecast
  cancel-in-progress: false

env:
  BRANCH: forecast-refresh
  LAST_DAY: "2026-11-25" # Wednesday, the last day any map models (Central time); none after it

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Still before the blast?
        id: when
        run: |
          today=$(TZ=America/Chicago date +%F)
          if [[ "$today" > "$LAST_DAY" ]]; then
            echo "It's $today, after $LAST_DAY; nothing to refresh." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.when.outputs.go == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v7
        if: steps.when.outputs.go == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        if: steps.when.outputs.go == 'true'
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Download forecasts and rebuild
        id: refresh
        if: steps.when.outputs.go == 'true'
        run: |
          set +e
          python tools/refresh_forecast.py
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "The forecasts haven't changed since the saved pull." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.refresh.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Push the branch and open or update the pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - > "$RUNNER_TEMP/body.md" <<'PY'
          import datetime as dt, html, json, re
          from pathlib import Path
          scen = Path("scenarios/iowa-aap-lead-azide")
          stamps = json.loads((scen / "met_cache/map_met_all.json").read_text())["__fetched__"]
          pulled = min(dt.datetime.fromisoformat(v) for v in stamps.values())
          cst = pulled.astimezone(dt.timezone(dt.timedelta(hours=-6)))
          page = (scen / "outputs/site/index.html").read_text(encoding="utf-8")
          i = page.find("<h3>Where the cloud goes")  # "... on Monday, Nov. 23" with two days
          j = page.find("<h3>", i + 4)
          text = html.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", page[i:j]))).strip()
          print(f"Forecasts pulled {cst:%b %-d, %Y, %-I:%M %p} CST by the scheduled refresh.\n")
          print(f"> {text}\n")
          print("Changes: `met_cache/map_met_all.json` (the new pull) and `tests/data/` "
                "(golden numbers regenerated for it). The full test suite passed.\n")
          print("**Before merging**, check the news: the court hold, the Iowa HHS time and "
                "\"the Army hasn't announced a time for Wednesday\" (`forecast_summary.py`). "
                "Merging deploys iowaleadtracker.com (the Deploy workflow) and updates "
                "the GitHub Pages mirror.")
          print(f"\nTITLE=Refresh forecast (pulled {cst:%b %-d, %-I:%M %p} CST)")
          PY
          title=$(sed -n 's/^TITLE=//p' "$RUNNER_TEMP/body.md")
          sed -i '/^TITLE=/d' "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add scenarios/*/met_cache/map_met_all.json tests/data/
          git commit -q -F - <<MSG
          $title

          Downloaded by .github/workflows/refresh-forecast.yml; golden regression
          data regenerated for the new saved forecasts (intended map change).
          MSG
          git push --force origin "$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "Updated $(gh pr view "$BRANCH" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base main --head "$BRANCH" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md"; then
            echo "Opened $(gh pr view "$BRANCH" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Couldn't open the pull request (allow GitHub Actions to create pull requests in the repository settings). Open it by hand: $url"
            echo "Pushed \`$BRANCH\`. Open the pull request by hand: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
