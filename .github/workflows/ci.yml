# Checks every branch push and pull request: the same hooks as `pre-commit run --all-files`,
# the full test suite (including the slow model runs), and an offline build of the site.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pre-commit (ruff, ruff format, mypy, fast tests, file checks)
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest (full suite, offline)
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - name: Build the site and the mirror from the saved forecasts
        working-directory: scenarios/iowa-aap-2026-11-20
        run: python make_map_picker.py --build --mirror "$RUNNER_TEMP/mirror"
      - name: The build must not download weather
        # A download would rewrite the saved forecasts, and the maps would no longer
        # match the ones on the site.
        run: git diff --exit-code -- 'scenarios/*/met_cache/'
