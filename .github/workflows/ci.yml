# Checks every branch push: the same hooks as `pre-commit run --all-files`, the full test
# suite (including the slow model runs), and an offline build of the site. A pull request
# shows the checks of its head commit, so there's no `pull_request` trigger: it ran CI a
# second time on every pull request, and on the forecast refresh pull requests (opened by
# github-actions[bot]) GitHub held that run for a maintainer to approve. The refresh
# workflows start CI on their branches themselves (`gh workflow run ci.yml`), because
# pushes made with the workflow token don't start other workflows. A pull request from a
# fork gets no automatic CI; run this workflow on its branch by hand.
#
# The front-end lint and the browser tests run on every branch push except main, so
# a pull request shows them but the merge to main doesn't run them again. A merge that
# resolves conflicts in the pages isn't checked before it deploys: run `pnpm lint`,
# `pnpm test:map` and `pnpm test:site` first.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pre-commit (ruff, ruff format, mypy, fast tests, file checks)
        run: pre-commit run --all-files --show-diff-on-failure

  lint-frontend:
    # oxlint (JavaScript) and ESLint (HTML, CSS) on the site's pages: see package.json
    if: github.ref != 'refs/heads/main'
    needs: build  # lints the built landing page, whose summary comes from the built maps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ needs.build.outputs.key }}
          path: scenarios/iowa-aap-lead-azide/outputs/site/
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - uses: pnpm/action-setup@v6  # the version in package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint the pages' JavaScript, CSS and HTML
        run: pnpm lint

  test-map:
    # the map page in Chromium, Firefox and WebKit (Safari), desktop and phone, with saved
    # map data: no build needed
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # the version in package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests of the map page
        run: pnpm test:map

  test-site:
    # the built site (landing, staged, brief, 404, a map on its own) in Chromium, Firefox and
    # WebKit, with the site's real headers (the CSP in force) and an accessibility scan
    if: github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ needs.build.outputs.key }}
          path: scenarios/iowa-aap-lead-azide/outputs/site/
      - uses: pnpm/action-setup@v6  # the version in package.json's packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests of the built site
        run: pnpm test:site

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Machine (CPU and numpy SIMD features, for numeric differences)
        run: |
          grep -m1 "model name" /proc/cpuinfo
          python -c "import numpy; numpy.show_runtime()"
      - name: pytest (full suite, offline)
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - name: Build the site and the mirror from the saved forecasts
        working-directory: scenarios/iowa-aap-lead-azide
        run: python make_map_picker.py --build --mirror "$RUNNER_TEMP/mirror"
      - name: The build must not download weather
        # A download would rewrite the saved forecasts, and the maps would no longer
        # match the ones on the site.
        run: git diff --exit-code -- 'scenarios/*/met_cache/'
      - name: Key for the files this build read
        id: key
        run: echo "key=$(python tools/site_key.py)" >> "$GITHUB_OUTPUT"
      - name: Save the site for the deploy
        # deploy.yml reuses this build when main has the same files (the same key), so
        # merging doesn't build the site a second time.
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ steps.key.outputs.key }}
          path: scenarios/iowa-aap-lead-azide/outputs/site/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
